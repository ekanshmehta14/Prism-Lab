<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}.wrap{font-family:Inter,Arial;color:#e5e7eb;background:#111827;border-radius:16px;padding:12px;user-select:none}.stage{position:relative;height:440px}.dial{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:min(480px,86vw);aspect-ratio:1;border-radius:50%;border:9px solid #334155;background:radial-gradient(circle,#020617 0 30%,#1e293b 31% 33%,#0f172a 34% 100%);box-shadow:inset 0 0 30px #000}.prism{position:absolute;left:50%;top:56%;width:0;height:0;border-left:42px solid transparent;border-right:42px solid transparent;border-bottom:72px solid rgba(167,139,250,.85);transform:translate(-50%,-50%);filter:drop-shadow(0 0 8px #8b5cf6)}.arm{position:absolute;left:50%;top:56%;width:146px;height:44px;transform-origin:0 50%;background:linear-gradient(90deg,#475569,#94a3b8);border-radius:6px;box-shadow:0 5px 12px #000}.eye{position:absolute;right:-52px;top:-10px;width:58px;height:64px;border-radius:9px;background:#020617;border:4px solid #64748b}.eye:after{content:'';position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle,#dbeafe,#475569);}.ticks{position:absolute;inset:12px;border-radius:50%;border:2px dotted #64748b}.degree{position:absolute;color:#f8fafc;font-size:18px;font-weight:900;text-shadow:0 2px 5px #000;z-index:4}.degree0{left:50%;top:-4px;transform:translate(-50%,-70%)}.degree90{right:-3px;top:50%;transform:translate(70%,-50%)}.degree180{left:50%;bottom:-4px;transform:translate(-50%,70%)}.degree270{left:-3px;top:50%;transform:translate(-70%,-50%)}.mercury-source{position:absolute;left:50%;top:2px;transform:translateX(-50%);width:105px;text-align:center;color:#fde047;font-size:11px;font-weight:900;line-height:1.15;letter-spacing:.4px;text-shadow:0 2px 6px #000}.mercury-source:before{content:'';display:block;width:18px;height:18px;margin:0 auto 5px;border-radius:50%;background:#fef08a;box-shadow:0 0 8px #fff,0 0 22px #3b82f6,0 0 32px #eab308}.mercury-source .origin{display:block;color:#fff;font-size:12px;margin-top:3px}.controls{display:flex;gap:8px;justify-content:center}.btn{border:0;border-radius:10px;padding:10px 16px;background:#334155;color:white;font-weight:700}.angle{text-align:center;color:#c4b5fd;font-size:18px;font-weight:800;margin-top:4px}body.light .wrap{background:#E2E8F0;color:#0F172A}body.light .dial{border-color:#94A3B8;background:radial-gradient(circle,#F8FAFC 0 30%,#CBD5E1 31% 33%,#E2E8F0 34% 100%);box-shadow:inset 0 0 30px #94A3B8,0 8px 24px rgba(15,23,42,.18)}body.light .arm{background:linear-gradient(90deg,#64748B,#CBD5E1)}body.light .eye{background:#E2E8F0;border-color:#64748B}body.light .degree{color:#0F172A;text-shadow:0 1px 3px white}body.light .ticks{border-color:#64748B}body.light .btn{background:#7C3AED;color:white;box-shadow:0 3px 10px rgba(124,58,237,.25)}body.light .angle{color:#5B21B6}body.light .mercury-source .origin{color:#0F172A}@media(max-width:600px){.stage{height:380px}.dial{width:min(340px,86vw)}}
</style></head><body><div class="wrap"><div class="stage" id="stage"><div class="dial"><div class="ticks"></div><span class="degree degree0">0°</span><div class="mercury-source">Hg SOURCE<span class="origin">ORIGIN 0°</span></div><span class="degree degree90">90°</span><span class="degree degree180">180°</span><span class="degree degree270">270°</span></div><div class="prism"></div><div class="arm" id="arm"><div class="eye"></div></div></div><div class="controls"><button class="btn" id="left">◀ −1°</button><button class="btn" id="right">+1° ▶</button></div><div class="angle" id="angle">180.0°</div></div><script>
const arm=document.getElementById('arm'),angleEl=document.getElementById('angle');let angle=180,drag=false,lastPointer=0,unwrapped=180,publishTimer=null;
function normalize(v){return ((v%360)+360)%360}
function applyAngle(v,notify){angle=normalize(v);arm.style.transform=`translateY(-50%) rotate(${angle-90}deg)`;angleEl.textContent=angle.toFixed(1)+'°';if(notify)Streamlit.setComponentValue(angle)}
function pointerAngle(e){const r=document.getElementById('stage').getBoundingClientRect();const touch=e.touches?e.touches[0]:e;const x=touch.clientX-r.left-r.width/2;const y=touch.clientY-r.top-r.height*.56;return normalize(Math.atan2(y,x)*180/Math.PI+90)}
function shortestDelta(current,previous){let d=current-previous;if(d>180)d-=360;if(d<-180)d+=360;return d}
function onMove(e){if(!drag)return;const current=pointerAngle(e);const delta=shortestDelta(current,lastPointer);lastPointer=current;unwrapped+=delta;applyAngle(unwrapped,false);clearTimeout(publishTimer);publishTimer=setTimeout(()=>Streamlit.setComponentValue(angle),80)}
const Streamlit={setComponentValue(v){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:normalize(v),dataType:'json'},'*')},setFrameHeight(h){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}};
const stage=document.getElementById('stage');stage.addEventListener('pointerdown',e=>{drag=true;lastPointer=pointerAngle(e);unwrapped=angle;e.preventDefault()});stage.addEventListener('pointermove',onMove,{passive:false});stage.addEventListener('pointerup',e=>{if(!drag)return;drag=false;clearTimeout(publishTimer);onMove(e);Streamlit.setComponentValue(angle)});stage.addEventListener('touchmove',onMove,{passive:false});
document.getElementById('left').onclick=()=>{unwrapped=angle-1;applyAngle(unwrapped,true)};document.getElementById('right').onclick=()=>{unwrapped=angle+1;applyAngle(unwrapped,true)};
window.addEventListener('message',e=>{if(e.data.type==='streamlit:render'){document.body.className=e.data.args.theme==='light'?'light':'';const incoming=Number(e.data.args.angle);if(Number.isFinite(incoming)&&!drag){angle=normalize(incoming);unwrapped=angle;applyAngle(angle,false)}}});window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');Streamlit.setFrameHeight(540);applyAngle(180,false);
</script></body></html>
