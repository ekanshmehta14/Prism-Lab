<!doctype html>
<html>
<body style="margin:0;background:#0A0F1C;overflow:hidden;touch-action:none;user-select:none">
<svg id="dial" viewBox="0 0 900 390" style="width:100%;height:390px;cursor:grab;touch-action:none"></svg>
<script>
const svg=document.getElementById("dial");
let reading=180, dragging=false;

function send(type, data){
  window.parent.postMessage({isStreamlitMessage:true,type,...data},"*");
}

function render(){
  const args=window.streamlitArgs || {};
  const cx=450, cy=245;
  const armAngle=(reading-180)*Math.PI/180;
  const x=cx+170*Math.cos(armAngle), y=cy+170*Math.sin(armAngle);
  const status=args.hit ? "#22C55E" : "#64748B";
  const parts=[];
  parts.push('<rect width="900" height="390" rx="18" fill="#0D1424"/>');
  parts.push('<circle cx="450" cy="245" r="130" fill="none" stroke="#24304A" stroke-width="10"/>');
  parts.push('<circle cx="450" cy="245" r="24" fill="#121A2B" stroke="#94A3B8" stroke-width="4"/>');
  parts.push('<polygon points="450,180 410,280 490,280" fill="#1B2A44" stroke="#C4B5FD" stroke-width="3"/>');
  parts.push('<line x1="450" y1="245" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+status+'" stroke-width="28" stroke-linecap="round"/>');
  parts.push('<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="48" fill="#1E293B" stroke="#94A3B8" stroke-width="16"/>');
  parts.push('<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="20" fill="#05070D" stroke="#94A3B8" stroke-width="4"/>');
  parts.push('<rect x="70" y="210" width="140" height="70" rx="12" fill="#334155" stroke="#94A3B8" stroke-width="4"/>');
  parts.push('<line x1="210" y1="245" x2="390" y2="245" stroke="#E8ECF5" stroke-width="3"/>');
  parts.push('<line x1="450" y1="245" x2="450" y2="100" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 7"/>');
  parts.push('<text x="450" y="38" fill="#E8ECF5" font-size="20" text-anchor="middle">Telescope reading '+reading.toFixed(2)+'&#176; - '+(args.side||'Left')+' side</text>');
  parts.push('<text x="450" y="370" fill="#A9B4CC" font-size="16" text-anchor="middle">Prism A = '+(args.prismAngle||60).toFixed(1)+'&#176;</text>');
  svg.innerHTML=parts.join("");
}

function pointerAngle(e){
  const rect=svg.getBoundingClientRect();
  const cx=rect.left+rect.width*0.5;
  const cy=rect.top+rect.height*(245/390);
  let angle=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI+180;
  if(angle<0)angle+=360;
  if(angle>=360)angle-=360;
  return angle;
}

svg.addEventListener("pointerdown",e=>{
  dragging=true;
  svg.setPointerCapture(e.pointerId);
  svg.style.cursor="grabbing";
  reading=pointerAngle(e);
  render();
  e.preventDefault();
});
svg.addEventListener("pointermove",e=>{
  if(!dragging)return;
  reading=pointerAngle(e);
  render();
});
svg.addEventListener("pointerup",e=>{
  if(!dragging)return;
  dragging=false;
  svg.style.cursor="grab";
  reading=pointerAngle(e);
  render();
  send("streamlit:setComponentValue",{value:Number(reading.toFixed(2)),dataType:"json"});
});
svg.addEventListener("pointercancel",()=>{dragging=false;svg.style.cursor="grab"});

window.addEventListener("message",e=>{
  if(!e.data || e.data.type!=="streamlit:render")return;
  window.streamlitArgs=e.data.args || {};
  if(!dragging){
    const value=Number(window.streamlitArgs.reading);
    if(Number.isFinite(value)){reading=value;render();}
  }
});

send("streamlit:componentReady",{apiVersion:1});
send("streamlit:setFrameHeight",{height:390});
render();
</script>
</body>
</html>
